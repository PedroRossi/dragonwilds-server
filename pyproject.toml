[project]
name = "dragonwilds"
version = "0.1.0"
description = "dw: invite code, backups, clean restarts and game updates for the Dragonwilds server stack"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
dw = "dragonwilds.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
